services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://taskflow:taskflow@db:5432/taskflow
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-me-dev-secret-change-me}
    ports:
      - "3000:3000"
    profiles: ["full"]

volumes:
  pgdata:
